openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: waitlist
    description: Waitlist operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /waitlist:
    post:
      operationId: joinWaitlist
      tags: [waitlist]
      summary: Join waitlist
      description: Register an email address for the FlowNote waitlist
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WaitlistInput"
      responses:
        "201":
          description: Successfully joined waitlist
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WaitlistEntry"
        "409":
          description: Email already on waitlist
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    get:
      operationId: getWaitlistStats
      tags: [waitlist]
      summary: Get waitlist stats
      description: Returns total count of waitlist signups
      responses:
        "200":
          description: Waitlist stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WaitlistStats"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    WaitlistInput:
      type: object
      required:
        - email
      properties:
        email:
          type: string
    WaitlistEntry:
      type: object
      required:
        - id
        - email
        - createdAt
      properties:
        id:
          type: number
        email:
          type: string
        createdAt:
          type: string
          format: date-time
    WaitlistStats:
      type: object
      required:
        - count
      properties:
        count:
          type: number
    ErrorResponse:
      type: object
      required:
        - error
      properties:
        error:
          type: string
