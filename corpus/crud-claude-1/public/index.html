<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Product Admin Dashboard</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="container">
    <header>
      <h1>Product Admin Dashboard</h1>
      <button id="add-btn" class="btn btn-primary">+ Add Product</button>
    </header>

    <div id="alert" class="alert hidden"></div>

    <table>
      <thead>
        <tr>
          <th>Name</th>
          <th>Price</th>
          <th>Description</th>
          <th class="actions-col">Actions</th>
        </tr>
      </thead>
      <tbody id="product-table-body">
        <tr>
          <td colspan="4" class="empty-state">Loading products…</td>
        </tr>
      </tbody>
    </table>
  </div>

  <div id="modal-backdrop" class="modal-backdrop hidden">
    <div class="modal">
      <h2 id="modal-title">Add Product</h2>
      <form id="product-form">
        <input type="hidden" id="product-id" />
        <label for="name">Name</label>
        <input type="text" id="name" required maxlength="200" />

        <label for="price">Price</label>
        <input type="number" id="price" step="0.01" min="0" required />

        <label for="description">Description</label>
        <textarea id="description" rows="3" maxlength="2000"></textarea>

        <div class="modal-actions">
          <button type="button" id="cancel-btn" class="btn btn-secondary">Cancel</button>
          <button type="submit" class="btn btn-primary">Save</button>
        </div>
      </form>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
