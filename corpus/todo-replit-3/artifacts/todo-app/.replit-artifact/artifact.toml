kind = "web"
previewPath = "/"
title = "To-Do App"
description = "A personal to-do list web app with email/password authentication. Users can sign up, log in, add tasks, mark them complete, and delete them. Each user only sees their own tasks."
version = "1.0.0"
id = "artifacts/todo-app"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 25230

[services.development]
run = "pnpm --filter @workspace/todo-app run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/todo-app", "run", "build" ]
serve = "static"
publicDir = "artifacts/todo-app/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "25230"
BASE_PATH = "/"
