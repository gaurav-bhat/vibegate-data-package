<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>To-Do</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="container">
    <!-- Auth screen -->
    <section id="auth-screen" class="auth-wrap">
      <div class="auth-card">
        <h1 class="brand">To-Do</h1>
        <div id="auth-alert" class="alert error hidden"></div>

        <form id="login-form">
          <h2>Log in</h2>
          <label for="login-email">Email</label>
          <input type="email" id="login-email" required autocomplete="email" />
          <label for="login-password">Password</label>
          <input type="password" id="login-password" required autocomplete="current-password" />
          <button type="submit" class="btn btn-primary btn-block">Log in</button>
          <p class="switch">
            No account? <a href="#" id="show-signup">Sign up</a>
          </p>
        </form>

        <form id="signup-form" class="hidden">
          <h2>Sign up</h2>
          <label for="signup-email">Email</label>
          <input type="email" id="signup-email" required autocomplete="email" />
          <label for="signup-password">Password</label>
          <input type="password" id="signup-password" required autocomplete="new-password" minlength="8" />
          <p class="hint">At least 8 characters.</p>
          <button type="submit" class="btn btn-primary btn-block">Sign up</button>
          <p class="switch">
            Have an account? <a href="#" id="show-login">Log in</a>
          </p>
        </form>
      </div>
    </section>

    <!-- App screen -->
    <section id="app-screen" class="hidden">
      <header>
        <h1>My Tasks</h1>
        <div class="user-bar">
          <span id="user-email" class="user-email"></span>
          <button id="logout-btn" class="btn btn-secondary">Log out</button>
        </div>
      </header>

      <form id="add-task-form" class="add-task-form">
        <input type="text" id="new-task-input" placeholder="Add a task..." autocomplete="off" />
        <button type="submit" class="btn btn-primary">Add</button>
      </form>

      <div id="task-alert" class="alert error hidden"></div>

      <ul id="task-list" class="task-list"></ul>
      <p id="empty-state" class="empty-state hidden">No tasks yet. Add one above.</p>
    </section>
  </div>

  <script src="app.js"></script>
</body>
</html>
