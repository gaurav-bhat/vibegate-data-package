<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Products · Admin</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="page">
    <header>
      <h1>Products</h1>
      <p class="subtitle">Add, edit, and remove items in the catalog.</p>
    </header>

    <div id="banner" class="banner hidden" role="status"></div>

    <section class="panel">
      <h2>Add a product</h2>
      <form id="create-form" class="inline-form" novalidate>
        <div class="field">
          <label for="new-name">Name</label>
          <input type="text" id="new-name" maxlength="200" placeholder="e.g. Wireless Mouse" required />
        </div>
        <div class="field field-price">
          <label for="new-price">Price</label>
          <input type="number" id="new-price" min="0" step="0.01" placeholder="0.00" required />
        </div>
        <div class="field field-grow">
          <label for="new-description">Description</label>
          <input type="text" id="new-description" maxlength="2000" placeholder="Optional details" />
        </div>
        <button type="submit" class="btn btn-primary">Add product</button>
      </form>
      <p id="create-error" class="field-error hidden"></p>
    </section>

    <section class="panel table-panel">
      <table>
        <thead>
          <tr>
            <th>Name</th>
            <th class="col-price">Price</th>
            <th>Description</th>
            <th class="col-actions">Actions</th>
          </tr>
        </thead>
        <tbody id="rows">
          <tr><td colspan="4" class="empty">Loading products…</td></tr>
        </tbody>
      </table>
    </section>
  </div>

  <template id="row-template">
    <tr>
      <td class="cell-name"></td>
      <td class="cell-price col-price"></td>
      <td class="cell-description"></td>
      <td class="col-actions">
        <div class="row-actions">
          <button type="button" class="btn btn-ghost btn-small btn-edit">Edit</button>
          <button type="button" class="btn btn-danger btn-small btn-delete">Delete</button>
        </div>
      </td>
    </tr>
  </template>

  <template id="edit-row-template">
    <tr class="editing">
      <td><input type="text" class="edit-name" maxlength="200" /></td>
      <td class="col-price"><input type="number" class="edit-price" min="0" step="0.01" /></td>
      <td><input type="text" class="edit-description" maxlength="2000" /></td>
      <td class="col-actions">
        <div class="row-actions">
          <button type="button" class="btn btn-primary btn-small btn-save">Save</button>
          <button type="button" class="btn btn-ghost btn-small btn-cancel">Cancel</button>
        </div>
      </td>
    </tr>
  </template>

  <script src="app.js"></script>
</body>
</html>
