<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Product Admin Dashboard</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="page">
    <header class="topbar">
      <div>
        <h1>Products</h1>
        <p class="subtitle">Manage your product catalog</p>
      </div>
      <button id="add-btn" class="btn btn-primary" type="button">+ Add product</button>
    </header>

    <div id="toast" class="toast hidden" role="status"></div>

    <main class="card">
      <table>
        <thead>
          <tr>
            <th>Name</th>
            <th>Price</th>
            <th>Description</th>
            <th class="col-actions">Actions</th>
          </tr>
        </thead>
        <tbody id="rows">
          <tr><td colspan="4" class="empty">Loading products…</td></tr>
        </tbody>
      </table>
    </main>
  </div>

  <div id="overlay" class="overlay hidden">
    <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="dialog-title">
      <h2 id="dialog-title">Add product</h2>
      <form id="product-form" novalidate>
        <input type="hidden" id="product-id" />

        <label for="name">Name</label>
        <input type="text" id="name" maxlength="200" required autocomplete="off" />

        <label for="price">Price (USD)</label>
        <input type="number" id="price" min="0" step="0.01" required />

        <label for="description">Description</label>
        <textarea id="description" rows="3" maxlength="2000"></textarea>

        <p id="form-error" class="form-error hidden"></p>

        <div class="dialog-actions">
          <button type="button" id="cancel-btn" class="btn btn-ghost">Cancel</button>
          <button type="submit" id="save-btn" class="btn btn-primary">Save product</button>
        </div>
      </form>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
